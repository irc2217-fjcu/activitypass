<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>離線倒數計時器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #1e1e2f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .timer-container {
      background: #27293d;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      width: 90%;
      max-width: 420px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #9a9a9a;
      letter-spacing: 1px;
    }
    .display {
      font-size: 4rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
      color: #00f2c3;
    }
    .inputs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .input-group label {
      font-size: 0.75rem;
      color: #9a9a9a;
      margin-bottom: 4px;
    }
    input[type="number"] {
      width: 65px;
      padding: 8px;
      font-size: 1.1rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 8px;
      background: #1e1e2f;
      color: #fff;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: #00f2c3;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.97);
    }
    .btn-start {
      background: #00f2c3;
      color: #1e1e2f;
    }
    .btn-pause {
      background: #fd5d93;
      color: #ffffff;
    }
    .btn-reset {
      background: #555a6d;
      color: #ffffff;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <h1>COUNTDOWN TIMER</h1>
    <div class="display" id="timeDisplay">00:00:00</div>

    <div class="inputs" id="inputSection">
      <div class="input-group">
        <label>時</label>
        <input type="number" id="inputHours" min="0" max="99" value="0">
      </div>
      <div class="input-group">
        <label>分</label>
        <input type="number" id="inputMinutes" min="0" max="59" value="5">
      </div>
      <div class="input-group">
        <label>秒</label>
        <input type="number" id="inputSeconds" min="0" max="59" value="0">
      </div>
    </div>

    <div class="controls">
      <button class="btn-start" id="startBtn">開始</button>
      <button class="btn-pause" id="pauseBtn" disabled>暫停</button>
      <button class="btn-reset" id="resetBtn">重設</button>
    </div>
  </div>

  <script>
    let remainingSeconds = 300; // 預設 5 分鐘
    let timerInterval = null;
    let isRunning = false;

    const display = document.getElementById('timeDisplay');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const inHours = document.getElementById('inputHours');
    const inMinutes = document.getElementById('inputMinutes');
    const inSeconds = document.getElementById('inputSeconds');

    // 格式化秒數為 HH:MM:SS
    function formatTime(totalSec) {
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function updateDisplay() {
      display.textContent = formatTime(remainingSeconds);
    }

    // 免網路音效：利用瀏覽器 Web Audio API 合成蜂鳴聲
    function playBeepSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        // 嗶三次
        [0, 0.25, 0.5].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime + delay); // A5 頻率
          gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.2);
        });
      } catch (e) {
        console.warn('音效播放失敗:', e);
      }
    }

    function startTimer() {
      if (isRunning) return;

      // 如果當前為 0，從輸入框讀取時間
      if (remainingSeconds <= 0) {
        const h = parseInt(inHours.value, 10) || 0;
        const m = parseInt(inMinutes.value, 10) || 0;
        const s = parseInt(inSeconds.value, 10) || 0;
        remainingSeconds = h * 3600 + m * 60 + s;
        if (remainingSeconds <= 0) return;
      }

      isRunning = true;
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      updateDisplay();

      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          playBeepSound();
          alert('時間到！');
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!isRunning) return;
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    function resetTimer() {
      pauseTimer();
      const h = parseInt(inHours.value, 10) || 0;
      const m = parseInt(inMinutes.value, 10) || 0;
      const s = parseInt(inSeconds.value, 10) || 0;
      remainingSeconds = h * 3600 + m * 60 + s;
      updateDisplay();
    }

    [inHours, inMinutes, inSeconds].forEach(input => {
      input.addEventListener('change', () => {
        if (!isRunning) resetTimer();
      });
    });

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    // 初始化顯示
    resetTimer();
  </script>
</body>
</html>
